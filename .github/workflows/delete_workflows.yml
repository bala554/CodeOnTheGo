name: Auto Delete Old Workflow Runs

on:
  workflow_run:
    workflows: ["Build Debug APK"]
    types:
      - completed

jobs:
  del_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 2       # Clears out anything older than 48 hours
          keep_minimum_runs: 3 # Still guarantees your last 3 runs remain untouched
