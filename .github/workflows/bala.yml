name: Build Android APK

on:
  push:
    branches: ["main", "stage"]
  workflow_dispatch:

jobs:
  build:
    name: Build Phone APK (ARM64-v8a)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install Flox Toolchain
        uses: flox/install-flox-action@v2

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build V8 Debug APK for Physical Devices (ARM64)
        run: |
          flox activate -d flox/base -- ./gradlew :app:assembleV8Debug --no-daemon --stacktrace

      - name: Upload Phone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "CodeOnTheGo-Phone-ARM64-debug"
          path: "app/build/outputs/apk/v8/debug/*.apk"
