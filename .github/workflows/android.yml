name: Build CodeOnTheGo APK (v8 flavor)

on:
  workflow_dispatch:
  push:
    branches: ["main", "stage", "acp-agent"]

defaults:
  run:
    working-directory: .

jobs:
  build:
    name: Build phone APK (arm64-v8a, V8 debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Create empty folders git does not keep
        run: |
          mkdir -p assets/release/common assets/release/v7 assets/release/v8 compose-preview
          # Dynamically create every module directory declared in settings.gradle.kts
          awk '/^include\(/,/^\)/' settings.gradle.kts \
            | grep -oE '":[A-Za-z0-9_:-]+"' | sed 's/"//g; s/^://; s#:#/#g' \
            | while read -r m; do
                [ -z "$m" ] && continue
                [ "$m" = "compose-preview" ] && continue
                mkdir -p "$m"
              done

      - name: Preflight - verify the project is complete
        shell: bash
        run: |
          missing=0
          need() { [ -e "$1" ] || { echo "::error::Missing in the repository: $1"; missing=1; }; }
          for p in settings.gradle.kts build.gradle.kts gradlew gradle/wrapper/gradle-wrapper.jar \
                   gradle/wrapper/gradle-wrapper.properties app/build.gradle.kts; do need "$p"; done

          # Properly parse modules from the standard include(...) block
          awk '/^include\(/,/^\)/' settings.gradle.kts \
            | grep -oE '":[A-Za-z0-9_:-]+"' | sed 's/"//g; s/^://; s#:#/#g' \
            | while read -r m; do
                [ -z "$m" ] && continue
                [ "$m" = "compose-preview" ] && continue
                [ -d "$m" ] || echo "$m"
              done > /tmp/missing_modules.txt

          if [ -s /tmp/missing_modules.txt ]; then
            while read -r m; do echo "::error::Module folder missing: $m"; done < /tmp/missing_modules.txt
            missing=1
          fi

          if [ "$missing" = 0 ]; then echo "Preflight OK: project is complete"; else
            echo "Preflight FAILED: the repository copy is incomplete (see errors above)"; exit 1; fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is missing or empty."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build V8 debug APK and extract error summary
        run: |
          # Run build and capture output
          ./gradlew :app:assembleV8Debug --no-daemon > raw-build.log 2>&1 || build_failed=true
                     
          if [ "$build_failed" = "true" ]; then
            echo "=== GRADLE BUILD FAILED ===" > failure-report.txt
            # Grab the specific failure block and the last 40 lines where Gradle summarizes the error
            grep -A 30 "BUILD FAILED" raw-build.log >> failure-report.txt 2>/dev/null || true
            if [ ! -s failure-report.txt ] || [ "$(wc -l < failure-report.txt)" -le 2 ]; then
              tail -n 40 raw-build.log > failure-report.txt
            fi
            exit 1
          fi

      - name: Upload concise failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-report
          path: failure-report.txt
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeOnTheGo-v8-debug
          path: app/build/outputs/apk/v8/debug/*.apk
          if-no-files-found: error
