name: Build CodeOnTheGo APK (v8 release with bundled assets)

on:
  workflow_dispatch:
  push:
    branches: ["main", "stage", "acp-agent"]

defaults:
  run:
    working-directory: .

jobs:
  build:
    name: Build phone APK (arm64-v8a, V8 release)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Create empty folders git does not keep
        run: |
          mkdir -p assets/release/common assets/release/v7 assets/release/v8 compose-preview
          # Dynamically create every module directory declared in settings.gradle.kts
          awk '/^include\(/,/^\)/' settings.gradle.kts \
            | grep -oE '":[A-Za-z0-9_:-]+"' | sed 's/"//g; s/^://; s#:#/#g' \
            | while read -r m; do
                [ -z "$m" ] && continue
                [ "$m" = "compose-preview" ] && continue
                mkdir -p "$m"
              done

      - name: Preflight - verify the project is complete
        shell: bash
        run: |
          missing=0
          need() { [ -e "$1" ] || { echo "::error::Missing in the repository: $1"; missing=1; }; }
          for p in settings.gradle.kts build.gradle.kts gradlew gradle/wrapper/gradle-wrapper.jar \
                   gradle/wrapper/gradle-wrapper.properties app/build.gradle.kts; do need "$p"; done

          # Properly parse modules from the standard include(...) block
          awk '/^include\(/,/^\)/' settings.gradle.kts \
            | grep -oE '":[A-Za-z0-9_:-]+"' | sed 's/"//g; s/^://; s#:#/#g' \
            | while read -r m; do
                [ -z "$m" ] && continue
                [ "$m" = "compose-preview" ] && continue
                [ -d "$m" ] || echo "$m"
              done > /tmp/missing_modules.txt

          if [ -s /tmp/missing_modules.txt ]; then
            while read -r m; do echo "::error::Module folder missing: $m"; done < /tmp/missing_modules.txt
            missing=1
          fi

          if [ "$missing" = 0 ]; then echo "Preflight OK: project is complete"; else
            echo "Preflight FAILED: the repository copy is incomplete (see errors above)"; exit 1; fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is missing or empty."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build self-contained V8 release APK and extract error summary
        shell: bash
        run: |
          set +e
          ./gradlew :app:assetsDownloadRelease :app:assembleV8Release --no-daemon --stacktrace --console=plain > raw-build.log 2>&1
          build_exit_code=$?
          set -e

          if [ "$build_exit_code" -ne 0 ]; then
            {
              echo "# ❌ Gradle Build Failure"
              echo ""
              echo "**Exit code:** \`$build_exit_code\`"
              echo ""
              echo '## Exact Gradle error (`What went wrong`)'
              echo '```text'
              if grep -q '^\* What went wrong:' raw-build.log; then
                awk '
                  /^\* What went wrong:/ { capture=1 }
                  capture && /^\* (Try|Exception is):/ { exit }
                  capture { print }
                ' raw-build.log
              else
                grep -n -B 3 -A 12 -E 'Execution failed for task|Could not resolve|Could not find|A problem occurred|^> ' raw-build.log | head -n 120 || tail -n 120 raw-build.log
              fi
              echo '```'
              echo ""
              echo "## Final Build Status"
              echo '```text'
              grep -E 'BUILD FAILED|FAILURE: Build failed' raw-build.log | tail -n 5 || true
              echo '```'
            } > failure-report.txt

            # This publishes the report directly to the GitHub Actions workflow run summary screen
            cat failure-report.txt >> "$GITHUB_STEP_SUMMARY"

            # This prints it to the terminal step log
            cat failure-report.txt

            echo ""
            echo "Full raw Gradle log will be attached as the gradle-raw-build-log artifact."

            exit "$build_exit_code"
          fi

          echo "Self-contained V8 release APK build completed successfully."

      - name: Upload concise failure report
        if: ${{ failure() && hashFiles('failure-report.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-report
          path: failure-report.txt
          if-no-files-found: error

      - name: Upload full Gradle build log
        if: ${{ failure() && hashFiles('raw-build.log') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gradle-raw-build-log
          path: raw-build.log
          if-no-files-found: error

      - name: Upload APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: CodeOnTheGo-v8-release
          path: app/build/outputs/apk/v8/release/*.apk
          compression-level: 0
          if-no-files-found: error

      - name: Add self-contained APK download link to summary
        env:
          APK_ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          {
            echo "## Downloads"
            echo "- [Download the arm64 release APK]($APK_ARTIFACT_URL)"
            echo "  This release APK contains the setup assets; no external assets-arm64-v8a.zip is required."
          } >> "$GITHUB_STEP_SUMMARY"
