name: Auto Delete Old Workflow Runs

on:
  workflow_run:
    workflows: ["Build CodeOnTheGo APK (v8 release with bundled assets)"]
    types:
      - completed
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  del_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 2
          keep_minimum_runs: 3
